<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>%VITE_APP_NAME% - Global Crypto Trading Platform</title>
    <meta name="title" content="%VITE_APP_NAME% - Global Crypto Trading Platform" />
    <meta name="description" content="Trade with confidence on %VITE_APP_NAME%, the global representative encrypted money trading platform. Buy, sell, and trade Bitcoin, Ethereum, USDT, and more with advanced security and real-time market data." />
    <meta name="keywords" content="cryptocurrency, crypto trading, Bitcoin, Ethereum, USDT, blockchain, digital assets, crypto exchange, trading platform" />
    <meta name="author" content="%VITE_APP_NAME%" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_PUBLIC_URL%" />
    <meta property="og:title" content="%VITE_APP_NAME% - Global Crypto Trading Platform" />
    <meta property="og:description" content="Trade with confidence on %VITE_APP_NAME%, the global representative encrypted money trading platform. Buy, sell, and trade Bitcoin, Ethereum, USDT, and more with advanced security and real-time market data." />
    <meta property="og:image" content="/src/assets/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="%VITE_APP_NAME%" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="%VITE_PUBLIC_URL%" />
    <meta property="twitter:title" content="%VITE_APP_NAME% - Global Crypto Trading Platform" />
    <meta property="twitter:description" content="Trade with confidence on %VITE_APP_NAME%, the global representative encrypted money trading platform. Buy, sell, and trade Bitcoin, Ethereum, USDT, and more with advanced security and real-time market data." />
    <meta property="twitter:image" content="/src/assets/logo.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_NAME%" />

    <!-- Canonical URL -->
    <link rel="canonical" href="%VITE_PUBLIC_URL%" />
  </head>
  <body>
    <!-- Prevent flash: apply theme class BEFORE React mounts -->
    <script>
      (function(){
        try{
          var t=localStorage.getItem('becxus-theme');
          if(t!=='light'){
            document.documentElement.classList.add('dark');
            var m=document.querySelector('meta[name="theme-color"]');
            if(m) m.setAttribute('content','#000000');
          } else {
            var m=document.querySelector('meta[name="theme-color"]');
            if(m) m.setAttribute('content','#ffffff');
          }
        }catch(e){document.documentElement.classList.add('dark');}
      })();
    </script>
    <!-- Prevent flash: apply cached accent theme BEFORE React mounts -->
    <script>
      (function(){
        try{
          var a=localStorage.getItem('becxus-accent');
          var valid=['amber','blue','violet','cyan','slate'];
          document.documentElement.setAttribute('data-accent', valid.indexOf(a)!==-1 ? a : 'amber');
        }catch(e){document.documentElement.setAttribute('data-accent','amber');}
      })();
    </script>
    <!-- Prevent flash: apply cached exchange name BEFORE React mounts -->
    <script>
      (function(){
        try{
          var n=localStorage.getItem('becxus-exchange-name');
          if(n) document.title = n + ' - Global Crypto Trading Platform';
        }catch(e){}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
